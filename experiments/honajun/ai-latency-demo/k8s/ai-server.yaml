apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: app-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
        - name: ai-server
          image: ai-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DEFAULT_DELAY
              value: "0.2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-svc
  namespace: app-demo
spec:
  selector:
    app: ai-server
  ports:
    - port: 8000
      targetPort: 8000
