apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-api
  namespace: app-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-api
  template:
    metadata:
      labels:
        app: spring-api
    spec:
      containers:
        - name: spring-api
          image: spring-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: AI_SERVER_URL
              value: "http://ai-server-svc:8000/infer"
            - name: AI_TIMEOUT_MS
              value: "1500"
            - name: AI_RETRIES
              value: "2"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 700m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spring-api-svc
  namespace: app-demo
spec:
  type: NodePort
  selector:
    app: spring-api
  ports:
    - port: 8080
      targetPort: 8080
