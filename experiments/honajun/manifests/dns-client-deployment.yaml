apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-client
  namespace: chaos-demo
  annotations:
    litmuschaos.io/chaos: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-client
  template:
    metadata:
      labels:
        app: dns-client
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.5.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%H:%M:%S) DNS=$(nslookup web.chaos-demo.svc.cluster.local 2>&1 | tail -2) HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://web.chaos-demo.svc.cluster.local)"
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
