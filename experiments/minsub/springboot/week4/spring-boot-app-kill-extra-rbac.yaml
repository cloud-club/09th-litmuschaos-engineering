apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spring-boot-app-kill-apps-extra-role
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spring-boot-app-kill-apps-extra-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: spring-boot-app-kill-sa
    namespace: default
roleRef:
  kind: Role
  name: spring-boot-app-kill-apps-extra-role
  apiGroup: rbac.authorization.k8s.io