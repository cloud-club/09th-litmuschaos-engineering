apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-target
  namespace: default
  labels:
    app: nginx-target
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-target
  template:
    metadata:
      labels:
        app: nginx-target
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - nginx-target
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-target-svc
  namespace: default
spec:
  selector:
    app: nginx-target
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
---
# Pod Drain 실험 중 최소 1개 Pod가 항상 살아있도록 보장
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-target-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nginx-target
