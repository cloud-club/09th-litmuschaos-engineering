apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-target
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaos-target
  template:
    metadata:
      labels:
        app: chaos-target
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-target-service
  namespace: default
spec:
  selector:
    app: chaos-target
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
